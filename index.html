<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Reels 作品集｜許喬昀</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: link-in-bio column (Portaly style) — profile card, then one block per client with a 2-up thumbnail grid */
:root{
  --bg:#F1EEF6; --bg2:#E6EEF6; --card:#FFFFFF; --ink:#1B1A22; --muted:#6E6A7C; --line:#E4E0EC;
  --accent:#6B4FE0; --chip:#EEE9FD; --scrim:rgba(0,0,0,.55);
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17151F; --bg2:#121820; --card:#211E2B; --ink:#EEEBF5; --muted:#A49FB5; --line:#332F40; --accent:#A996FF; --chip:#2D2742; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17151F; --bg2:#121820; --card:#211E2B; --ink:#EEEBF5; --muted:#A49FB5; --line:#332F40; --accent:#A996FF; --chip:#2D2742; color-scheme:dark}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--bg),var(--bg2)) fixed;background-color:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;min-height:100vh}
.col{max-width:480px;margin:0 auto;padding-block:36px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.profile{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:4px}
.avatar{width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:900;box-shadow:0 0 0 4px var(--card)}
.profile h1{font-size:22px;font-weight:900;margin:8px 0 0}
.profile p{margin:0;color:var(--muted);font-size:14px;max-width:34ch}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.chips a{font-size:13px;text-decoration:none;color:var(--accent);background:var(--chip);padding:4px 12px;border-radius:999px}

.block{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.bhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bhead h2{font-size:17px;font-weight:900;margin:0}
.bhead span{font-size:12px;color:var(--muted);white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin:-6px 0 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

.tile{position:relative;display:block;aspect-ratio:9/16;max-width:100%;border-radius:12px;overflow:hidden;background:var(--chip);text-decoration:none;color:#fff;border:0;padding:0;cursor:pointer;font:inherit;width:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.tile:hover img{transform:scale(1.04)}
.tile .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--accent);font-weight:700}
.tile .ph svg{width:34px;height:34px;fill:currentColor;opacity:.85}
.tile .ov{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;background:linear-gradient(transparent,var(--scrim));display:flex;flex-direction:column;gap:2px;text-align:left}
.tile .t{font-size:12.5px;font-weight:700;line-height:1.35;text-shadow:0 1px 2px rgba(0,0,0,.4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .v{font-size:12px;display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.tile .v svg{width:14px;height:14px;fill:#fff}
.tile .badge{position:absolute;top:8px;right:8px;font-size:11px;background:var(--scrim);padding:2px 8px;border-radius:999px}
.tile.link .ov{color:var(--ink);background:none;text-shadow:none}
.tile.link .t{text-shadow:none}

footer{text-align:center;font-size:12px;color:var(--muted)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none}
.modal video{max-height:100%;max-width:100%;aspect-ratio:9/16;border-radius:14px;background:#000}
.modal button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.tile img{transition:none}.tile:hover img{transform:none}}
</style>
</head><body>

<main class="col">
  <section class="profile">
    <div class="avatar">喬</div>
    <h1>許喬昀</h1>
    <p>品牌短影音企劃｜Reels 腳本・拍攝・剪輯｜高雄</p>
    <nav class="chips" aria-label="業主"><a href="#bbq">艾伶燒肉</a><a href="#stylist">小黎造型</a><a href="#kiki">DJ KIKI</a></nav>
  </section>

  <section class="block" id="bbq">
    <div class="bhead"><h2>艾伶燒肉</h2><span>精緻燒肉・3 支</span></div>
    <div class="grid" data-ig="DXtab3qgJ9_|b_DXta.jpg|2,631|全台首家寵物友善精緻燒肉;DWGbSLMkkQl|b_DWGb.jpg|3,248|$780 吃這些？還有免費專業代烤;DV8O2FiAHGT|b_DV8O.jpg|1,780|只管享受，火候交給我們"></div>
  </section>

  <section class="block" id="stylist">
    <div class="bhead"><h2>小黎 VINA Makeup Studio</h2><span>造型師・9 支</span></div>
    <div class="grid" data-ig="DZKf1XchpdB|v2.jpg|2,258;DZkSu0tp0Nz|v3.jpg|1,809;Daozhffpg99|v5.jpg|594;DaDM1FVpha7|v6.jpg|476;DZ9_rfbpPRL|v7.jpg|2,646;DY4eWrzBUnA|v8.jpg|1,502;DYo-KFjBL-C|v9.jpg|2,010;DYcNFjQJyje|v10.jpg|1,670;DYPWIudpufZ|v11.jpg|1,393"></div>
  </section>

  <section class="block" id="kiki">
    <div class="bhead"><h2>DJ KIKI</h2><span>網紅 IP・8 支</span></div>
    <p class="note">原帳號已遭 IG 停權，點縮圖直接播放成片。</p>
    <div class="grid">
      <button class="tile" data-v="k3.mp4"><img src="k3.jpg" alt=""><div class="ov"><div class="t">有後悔刺青嗎？雷射除刺青實錄</div><div class="v"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg>10.3 萬</div></div></button>
      <button class="tile" data-v="k1.mp4"><img src="k1.jpg" alt=""><div class="ov"><div class="t">對啊，我承認我後悔刺青了</div><div class="v"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg>5.5 萬</div></div></button>
      <button class="tile" data-v="k2.mp4"><img src="k2.jpg" alt=""><div class="ov"><div class="t">謝謝三媽</div><div class="v"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg>1.1 萬</div></div></button>
      <button class="tile" data-v="k6.mp4"><img src="k6.jpg" alt=""><div class="ov"><div class="t">我們家原本是無神論，但我信了</div><div class="v"><svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg>9,057</div></div></button>
      <button class="tile" data-v="k4.mp4"><img src="k4.jpg" alt=""><div class="ov"><div class="t">男生也要做臉｜深層清潔</div></div></button>
      <button class="tile" data-v="k8.mp4"><img src="k8.jpg" alt=""><div class="ov"><div class="t">最適合男生的韓式藻針</div></div></button>
      <button class="tile" data-v="k5.mp4"><img src="k5.jpg" alt=""><div class="ov"><div class="t">高冷男 VS 撒嬌男</div></div></button>
      <button class="tile" data-v="k7.mp4"><img src="k7.jpg" alt=""><div class="ov"><div class="t">Up Side Inside And Round</div></div></button>
    </div>
  </section>

  <footer>© 許喬昀 品牌短影音企劃</footer>
</main>

<div class="modal" id="modal" hidden><button type="button" aria-label="關閉">×</button><video id="mv" controls playsinline></video></div>

<script>
const eye='<svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 110-8 4 4 0 010 8z"/></svg>';
const play='<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
/* IG reels: each entry may later carry a thumb + views — format id|thumb.jpg|views */
document.querySelectorAll('[data-ig]').forEach(g=>{
  g.dataset.ig.split(';').forEach((raw,i)=>{
    const [id,thumb,views,title]=raw.split('|');
    const a=document.createElement('a');
    a.href='https://www.instagram.com/reel/'+id+'/';a.target='_blank';a.rel='noopener';
    a.className='tile'+(thumb?'':' link');
    const n='Reel '+String(i+1).padStart(2,'0');
    a.innerHTML=(thumb?'<img src="'+thumb+'" alt="">':'<div class="ph">'+play+'<span>'+n+'</span></div>')+
      '<span class="badge">IG ↗</span><div class="ov">'+''+
      (views?'<div class="v">'+eye+views+'</div>':'')+'</div>';
    a.setAttribute('aria-label','在 Instagram 觀看：'+(title||n));
    g.appendChild(a);
  });
});
const modal=document.getElementById('modal'),mv=document.getElementById('mv');
document.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{mv.src=b.dataset.v;modal.hidden=false;mv.play().catch(()=>{})}));
function close(){mv.pause();mv.removeAttribute('src');mv.load();modal.hidden=true}
modal.querySelector('button').addEventListener('click',close);
modal.addEventListener('click',e=>{if(e.target===modal)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)close()});
</script>

</body></html>
